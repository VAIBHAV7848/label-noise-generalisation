# Master Default Configuration for Minimum Decisive Experiment Set (MDES)
project:
  name: "label-noise-generalisation"
  version: "1.1.0"
  phase: "MDES Scoped Execution"

seeds:
  - 42
  - 1337
  - 2024
  - 7
  - 999

datasets:
  synthetic:
    - name: "cifar10"
      num_classes: 10
      regimes:
        - type: "symmetric"
          rates: [0.2, 0.5]
        - type: "asymmetric"
          rates: [0.2, 0.4]
    - name: "cifar100"
      num_classes: 100
      regimes:
        - type: "symmetric"
          rates: [0.4]
  real_world:
    - name: "cifar10n"
      regimes: ["aggre", "worst"]

models:
  resnet18:
    arch: "PreActResNet18"
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    epochs: 120
    batch_size: 128
    lr_schedule: "cosine"
  mlp:
    arch: "TwoLayerMLP"
    hidden_dim: 512
    dropout: 0.2
    lr: 0.001
    epochs: 100
    batch_size: 128

baselines:
  - "CE"
  - "LabelSmoothing"
  - "GCE"
  - "SCE"
  - "ForwardCorrection"
  - "BackwardCorrection"
  - "ConfidentLearning"

metrics:
  classification:
    - "top1_accuracy"
    - "top5_accuracy"
  calibration:
    - "ece_15bins"
    - "ada_ece"
    - "brier_score"
    - "val_calibration_delta"
  estimation:
    - "frobenius_error"
    - "spectral_error"
